<h2 mat-dialog-title>{{ data.title || 'ยืนยันการทำรายการ' }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">ยกเลิก</button>
  
  <button mat-flat-button 
          [color]="data.color || 'primary'" 
          (click)="onConfirm()">
    {{ data.confirmText || 'ตกลง' }}
  </button>
</mat-dialog-actions>
