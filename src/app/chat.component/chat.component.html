<div class="chat-container">
  <div class="chat-header">
    <div class="user-info">
      <div class="status-dot"></div>
      <h3>ฝ่ายบุคคล (HR) - สนทนากับ {{ currentUser }}</h3>
    </div>
  </div>

  <div class="message-list">
    <div *ngFor="let msg of messages" [ngClass]="{'msg-me': msg.sender === 'me', 'msg-other': msg.sender === 'other'}">
      <div class="bubble">
        {{ msg.text }}
        <span class="time">{{ msg.time | date:'HH:mm' }}</span>
      </div>
    </div>
  </div>

  <div class="chat-input-area">
    <input type="text" [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" placeholder="พิมพ์ข้อความที่นี่...">
    <button (click)="sendMessage()" class="btn-send">
      <span>ส่ง</span>
    </button>
  </div>
</div>
